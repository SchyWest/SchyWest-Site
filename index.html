<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Schy West</title>
<meta name="description" content="Schy West · recording artist, sound engineer, producer. Music, links and everything else in one place.">
<meta property="og:title" content="Schy West">
<meta property="og:description" content="Schy West · recording artist, sound engineer, producer. Music, links and everything else in one place.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#06080e">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2216%22%20fill%3D%22%2306080e%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%2220%22%20fill%3D%22none%22%20stroke%3D%22%23a9d8ff%22%20stroke-width%3D%225%22%2F%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%225%22%20fill%3D%22%23ffb98a%22%2F%3E%3C%2Fsvg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="sw-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style id="sw-style">
/* Layout: one 460px "phone" column floating over an ambient field; every block is rendered from the JSON state below, so the owner editor can restyle and reorder anything. */
:root{
  --bg:#06080e; --fg:#edf2fa; --muted:#8b97ad; --accent:#a9d8ff; --accent2:#ffb98a;
  --glass:color-mix(in srgb,var(--fg) 6%,transparent);
  --glass-hi:color-mix(in srgb,var(--fg) 12%,transparent);
  --line:color-mix(in srgb,var(--fg) 11%,transparent);
  --sunk:color-mix(in srgb,var(--bg) 70%,transparent);
  --on-accent:#06080e;
  --spotify:#1ed760; --apple:#fa2d48; --amazon:#25a6e8;
  --f-display:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:22px; --speed:1;
  --ease:cubic-bezier(.22,1,.36,1);
  /* editor chrome (fixed, independent of the page theme) */
  --ed-bg:#0f1115; --ed-raise:#171a20; --ed-fg:#eceef2; --ed-muted:#8a909c; --ed-line:#262a33; --ed-accent:#8ab4ff;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}img{max-width:100%}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;transition:padding-right .45s var(--ease)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:10px}

/* ambient field */
.field{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.field i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:fieldDrift calc(26s/var(--speed)) ease-in-out infinite alternate}
.field i:nth-child(1){width:60vmax;height:60vmax;left:-20vmax;top:-25vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 35%,var(--bg)),transparent 65%)}
.field i:nth-child(2){width:50vmax;height:50vmax;right:-18vmax;top:20vh;background:radial-gradient(circle,color-mix(in srgb,var(--accent2) 22%,var(--bg)),transparent 65%);animation-duration:calc(32s/var(--speed))}
.field i:nth-child(3){width:45vmax;height:45vmax;left:20vw;bottom:-25vmax;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,var(--bg)),transparent 65%);animation-duration:calc(38s/var(--speed))}
.field::after{content:"";position:absolute;inset:0;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.5'/></svg>");opacity:.06;mix-blend-mode:overlay}
@keyframes fieldDrift{0%{transform:translate(-3%,-2%) rotate(-6deg)}100%{transform:translate(5%,4%) rotate(9deg) scale(1.12)}}
.no-ambient .field{display:none}

.page{position:relative;z-index:1;max-width:460px;margin:0 auto;overflow:hidden;overflow:clip;background:var(--bg);min-height:100vh;box-shadow:0 0 0 1px var(--line),0 40px 120px rgba(0,0,0,.45);animation:pageIn .9s var(--ease) both}
@keyframes pageIn{from{opacity:.4}}
@media (min-width:700px){.page{margin-block:28px;border-radius:34px;overflow:hidden;min-height:0}}

/* ---------- HERO ---------- */
.hero{position:relative;height:clamp(400px,112vw,520px);overflow:hidden;isolation:isolate}
.hero.short{height:clamp(320px,86vw,400px)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:-3}
.hero .photo{position:absolute;inset:0;background-size:cover;background-position:center 25%;z-index:-2;-webkit-mask-image:linear-gradient(#000 45%,transparent 94%);mask-image:linear-gradient(#000 45%,transparent 94%);animation:photoIn 1.6s var(--ease) both}
.hero.photo-mode canvas{opacity:.55}
@keyframes photoIn{from{transform:scale(1.12);filter:blur(12px)}}
.hero::after{content:"";position:absolute;inset:auto 0 0 0;height:55%;background:linear-gradient(transparent,var(--bg) 88%);z-index:-1;pointer-events:none}
.hero-inner{position:absolute;inset:auto 0 0 0;padding:0 20px 18px;text-align:center}
.hero.left .hero-inner{text-align:left}.hero.left .name{justify-content:flex-start}
.tag{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:999px;background:color-mix(in srgb,var(--bg) 45%,transparent);border:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:500 11.5px/1 var(--f-mono);letter-spacing:.04em;color:var(--muted);animation:rise .9s .1s var(--ease) both}
.tag b{font-weight:500;color:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);position:relative;flex:none}
.dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--accent2);animation:ping 2s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
.name{margin:14px 0 4px;font:800 clamp(56px,17vw,84px)/.86 var(--f-display);letter-spacing:-.055em;display:flex;justify-content:center;flex-wrap:wrap;column-gap:.18em;min-height:.9em}
.case-lower .name{text-transform:lowercase}.case-upper .name{text-transform:uppercase;letter-spacing:-.03em}
.name .w{display:inline-flex}
.name .ch{display:inline-block;background:linear-gradient(180deg,var(--fg) 10%,var(--accent) 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:.06em}
.intro-blur .name .ch{animation:chBlur 1s var(--ease) both;animation-delay:calc(var(--i) * 55ms + .25s)}
@keyframes chBlur{from{transform:translateY(.45em) rotate(4deg);filter:blur(10px);opacity:0}}
.intro-drop .name .ch{animation:chDrop .9s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i) * 60ms + .2s)}
@keyframes chDrop{0%{transform:translateY(-1.6em) rotate(var(--r,8deg));opacity:0}60%{opacity:1}}
.intro-type .name .ch{animation:chType .01s steps(1) both;animation-delay:calc(var(--i) * 90ms + .3s)}
@keyframes chType{from{opacity:0}}
.intro-type .name::after{content:"";width:.06em;height:.8em;align-self:center;margin-left:.04em;background:var(--accent);animation:caret 1s steps(1) infinite}
.role{margin:10px 0 0;color:var(--muted);font-size:14.5px;min-height:1.5em;animation:rise .9s .75s var(--ease) both}
.role .caret{display:inline-block;width:1.5px;height:1em;background:var(--accent);margin-left:2px;vertical-align:-2px;animation:caret 1s steps(1) infinite}
@keyframes caret{50%{opacity:0}}
@keyframes rise{from{transform:translateY(12px);opacity:0;filter:blur(4px)}}

/* ---------- SOCIALS ---------- */
.socials{display:flex;justify-content:center;gap:6px;padding:16px 16px 6px;flex-wrap:wrap}
.socials a{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--fg);transition:transform .35s var(--ease),background .25s,color .25s;animation:pop .6s var(--ease) both;animation-delay:calc(var(--i) * 60ms + .9s)}
.socials a:hover{background:var(--glass-hi);color:var(--accent);transform:translateY(-3px)}
.socials a:active{transform:scale(.92)}
.socials svg{width:22px;height:22px}
@keyframes pop{from{transform:scale(.4);opacity:0}}

/* ---------- STACK ---------- */
.stack{display:flex;flex-direction:column;gap:14px;padding:14px 16px 28px}
.blk{display:flex;flex-direction:column;gap:10px;min-width:0}
.label{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 2px 0;font:600 13px/1 var(--f-body);color:var(--accent);letter-spacing:.01em}
.label small{font:400 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.card{position:relative;border-radius:var(--r);background:var(--glass);border:1px solid var(--line);overflow:hidden;transition:transform .5s var(--ease),border-color .3s}
.cards-solid .card{background:color-mix(in srgb,var(--fg) 8%,var(--bg));backdrop-filter:none}
.cards-outline .card{background:transparent;border-color:color-mix(in srgb,var(--fg) 22%,transparent)}
.card:hover{border-color:color-mix(in srgb,var(--accent) 30%,transparent)}
.eyebrow{font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent2);display:flex;align-items:center;gap:7px}
.title{font:700 22px/1.08 var(--f-display);letter-spacing:-.02em;margin:7px 0 3px;text-wrap:balance;overflow-wrap:anywhere}
.sub{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--glass-hi);font-weight:500;font-size:13.5px;transition:transform .3s var(--ease),background .25s}
.pill:hover{background:color-mix(in srgb,var(--fg) 20%,transparent);transform:translateY(-2px)}
.pill:active{transform:scale(.96)}
.pill svg{width:17px;height:17px;flex:none}
.pill.solid{background:var(--fg);color:var(--bg)}
.pill.solid:hover{background:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}

/* reveal styles (content is visible at rest; JS only hides what starts below the fold) */
.rv{transition:opacity .9s var(--ease),transform .9s var(--ease),filter .9s var(--ease)}
.rv-rise .rv.pre{opacity:0;transform:translate3d(0,1.6rem,0);filter:blur(6px)}
.rv-drop .rv.pre{opacity:0;transform:translate3d(var(--dx,0),-80px,0) rotate(var(--dr,-3deg))}
.rv-drop .rv{transition-timing-function:cubic-bezier(.34,1.4,.64,1)}
.rv-tilt .rv.pre{opacity:0;transform:perspective(700px) rotateX(28deg) scale(.92);transform-origin:50% 100%}
.rv-none .rv.pre{opacity:1;transform:none;filter:none}

/* ---------- TICKER ---------- */
.ticker{margin:0 -16px;overflow:hidden;border-block:1px solid var(--line);padding:11px 0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.ticker .tk{display:flex;width:max-content;animation:marquee calc(var(--dur,30s)/var(--speed)) linear infinite}
.ticker:hover .tk{animation-play-state:paused}
.ticker span{display:inline-flex;align-items:center;gap:14px;padding-right:14px;white-space:nowrap;font:600 15px/1 var(--f-display);letter-spacing:-.01em;text-transform:lowercase}
.ticker span::after{content:"✦";color:var(--accent);font-size:11px}
@keyframes marquee{to{transform:translate3d(-50%,0,0)}}

/* ---------- FEATURED ---------- */
.feature{padding:16px;display:grid;grid-template-columns:112px 1fr;gap:16px;align-items:center;transform-origin:50% 100%}
.feature .bg{position:absolute;inset:-30%;z-index:-1;filter:blur(40px) saturate(1.3);opacity:.45}
.disc-wrap{position:relative;width:112px;height:112px}
.sleeve{position:absolute;inset:0;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:2;background-size:cover;background-position:center}
.vinyl{position:absolute;inset:6px;border-radius:50%;z-index:1;background:repeating-radial-gradient(circle at 50% 50%,#0b0b0d 0 1.5px,#17181c 1.5px 3px);box-shadow:0 6px 20px rgba(0,0,0,.6);transition:transform .9s var(--ease)}
.vinyl::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 30deg,transparent 0 20%,rgba(255,255,255,.12) 25%,transparent 32% 70%,rgba(255,255,255,.08) 75%,transparent 82%)}
.vinyl::after{content:"";position:absolute;inset:34%;border-radius:50%;background:var(--label);background-size:cover;background-position:center;box-shadow:inset 0 0 0 5px rgba(0,0,0,.25)}
.vinyl .hole{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px;border-radius:50%;background:var(--bg);z-index:1}
.feature.playing .vinyl{transform:translateX(44px);animation:spin 2.4s linear infinite}
@keyframes spin{to{rotate:360deg}}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
.eq span{width:2.5px;background:var(--accent2);border-radius:1px;height:30%}
.feature.playing .eq span{animation:eq .9s ease-in-out infinite alternate}
.eq span:nth-child(2){animation-delay:-.3s!important}.eq span:nth-child(3){animation-delay:-.6s!important}.eq span:nth-child(4){animation-delay:-.15s!important}
@keyframes eq{0%{height:20%}100%{height:100%}}
.feature .platforms{grid-column:1/-1}
.spin-btn{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg);transition:transform .3s var(--ease)}
.spin-btn:hover{transform:scale(1.08)}
.spin-btn svg{width:14px;height:14px}

/* ---------- COUNTDOWN ---------- */
.drop{padding:20px 18px 18px;text-align:center}
.drop h3{margin:8px 0 2px;font:700 26px/1 var(--f-display);letter-spacing:-.03em;overflow-wrap:anywhere}
.case-lower .drop h3{text-transform:lowercase}
.clock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0 16px}
.unit{padding:12px 4px 9px;border-radius:12px;background:var(--sunk);border:1px solid var(--line);overflow:hidden}
.unit b{display:block;font:500 28px/1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.unit b.tick{animation:tick .45s var(--ease)}
@keyframes tick{from{transform:translateY(-40%);opacity:.2;filter:blur(3px)}}
.unit span{display:block;margin-top:6px;font:400 10px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.presave{display:flex;flex-direction:column;gap:8px}
.presave a{position:relative;display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:999px;color:#fff;font-weight:600;font-size:14.5px;overflow:hidden;transition:transform .3s var(--ease)}
.presave a::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 4.5s ease-in-out infinite;animation-delay:var(--d,0s)}
@keyframes sheen{0%,60%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.presave a:hover{transform:translateY(-2px) scale(1.01)}
.presave a svg{width:22px;height:22px}
.presave a .arr{margin-left:auto}
.presave .spotify{background:var(--spotify);color:#04120a}.presave .apple{background:var(--apple)}.presave .amazon{background:var(--amazon)}

/* ---------- LINKS ---------- */
.links{display:flex;flex-direction:column;gap:10px}
.lnk{position:relative;display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:calc(var(--r) * .75);background:var(--glass);border:1px solid var(--line);font-weight:600;overflow:hidden;transition:transform .35s var(--ease),border-color .3s}
.lnk::before{content:"";position:absolute;inset:0;background:radial-gradient(160px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--accent) 22%,transparent),transparent 70%);opacity:0;transition:opacity .3s}
.lnk:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.lnk:hover::before{opacity:1}
.lnk .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--glass-hi);flex:none}
.lnk .ic svg{width:18px;height:18px}
.lnk .t{min-width:0;flex:1;overflow-wrap:anywhere}
.lnk .t small{display:block;font-weight:400;font-size:12px;color:var(--muted)}
.lnk .go{opacity:.6;transition:transform .3s var(--ease)}
.lnk:hover .go{transform:translate(3px,-3px);opacity:1}

/* ---------- CATALOG RAIL ---------- */
.rail-nav{display:flex;gap:4px}
.rail-nav button{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--muted);transition:background .2s,color .2s}
.rail-nav button:hover{background:var(--glass-hi);color:var(--fg)}
.rail{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -16px;padding:6px 16px 8px;scrollbar-width:none;overscroll-behavior-x:contain}
.rail::-webkit-scrollbar{display:none}
.disc-item{flex:0 0 46%;scroll-snap-align:start;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.disc{position:relative;width:100%;aspect-ratio:1;max-width:100%;border-radius:50%;box-shadow:0 14px 34px rgba(0,0,0,.5);transition:transform .6s var(--ease);background-size:cover;background-position:center}
.disc::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 2px,rgba(0,0,0,.12) 2px 3px),conic-gradient(from 0deg,transparent,rgba(255,255,255,.18),transparent 30%,transparent 60%,rgba(255,255,255,.1),transparent 85%)}
.disc::after{content:"";position:absolute;left:50%;top:50%;width:14%;height:14%;transform:translate(-50%,-50%);border-radius:50%;background:var(--bg);box-shadow:0 0 0 5px rgba(255,255,255,.12)}
.disc-item:hover .disc{transform:scale(1.04)}
.disc-item:hover .disc,.disc-item.active .disc{animation:spin calc(6s/var(--speed)) linear infinite}
.disc-item h4{margin:0;font:600 14px/1.2 var(--f-body);overflow-wrap:anywhere}
.disc-item p{margin:2px 0 0;font:400 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.04em}

/* ---------- SHELF ---------- */
.shelf{display:flex;overflow-x:auto;margin:0 -16px;padding:18px 16px 26px;perspective:900px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}
.cover{flex:0 0 108px;height:150px;margin-right:-34px;border-radius:10px;transform:rotateY(38deg);transform-origin:left center;box-shadow:-10px 14px 30px rgba(0,0,0,.6),inset 0 0 0 1px rgba(255,255,255,.08);transition:transform .55s var(--ease),margin .55s var(--ease);position:relative;overflow:hidden;background-size:cover;background-position:center}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.18),transparent 18%,transparent 80%,rgba(0,0,0,.25))}
.cover span{position:absolute;left:10px;bottom:10px;right:10px;font:700 13px/1.05 var(--f-display);letter-spacing:-.01em;color:rgba(255,255,255,.92);text-shadow:0 1px 8px rgba(0,0,0,.5);z-index:1}
.case-lower .cover span{text-transform:lowercase}
.cover:hover,.cover:focus-visible{transform:rotateY(0deg) translateY(-8px) scale(1.04);margin-right:6px;z-index:2}
.shelf.dropping .cover{animation:coverDrop 1s cubic-bezier(.34,1.3,.64,1) both;animation-delay:calc(var(--i) * 90ms)}
@keyframes coverDrop{0%{opacity:0;transform:translate3d(var(--dx),-260px,0) rotate(var(--dr)) rotateY(38deg)}70%{opacity:1}}

/* ---------- ORBIT ---------- */
.orbit{position:relative;aspect-ratio:1;max-width:100%;margin:4px auto 0;width:min(100%,380px)}
.orbit .ring{position:absolute;inset:8%;border-radius:50%;border:1px dashed color-mix(in srgb,var(--fg) 20%,transparent);animation:spin calc(var(--dur,30s)/var(--speed)) linear infinite}
.orbit .ring.r2{inset:24%;animation-direction:reverse;animation-duration:calc(var(--dur,30s)*.8/var(--speed))}
.orbit .sat{position:absolute;left:50%;top:0;width:var(--s,74px);height:var(--s,74px);transform:translate(-50%,-50%) rotate(calc(var(--a) * -1));transition:scale .4s var(--ease)}
.orbit .sat:hover{scale:1.12}
.orbit .arm{position:absolute;inset:0;transform:rotate(var(--a))}
.orbit .sat-in{position:absolute;inset:0;border-radius:14px;background:var(--img) center/cover;box-shadow:0 10px 26px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.1);animation:spin calc(var(--dur,30s)/var(--speed)) linear infinite reverse}
.orbit .ring.r2 .sat-in{animation-direction:normal;animation-duration:calc(var(--dur,30s)*.8/var(--speed))}
.orbit .core{position:absolute;inset:36%;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 30%,var(--bg)),var(--bg) 70%);border:1px solid var(--line);box-shadow:0 0 60px color-mix(in srgb,var(--accent) 25%,transparent);background-size:cover;background-position:center;overflow:hidden}
.orbit .core b{font:800 clamp(16px,5vw,22px)/1 var(--f-display);letter-spacing:-.03em;padding:8px}

let disposers = [];
const onDispose = fn => disposers.push(fn);
function dispose(){ disposers.forEach(f => { try { f(); } catch (e) {} }); disposers = []; }
function loop(fn, el){ let run = true, vis = true, id; const io = el ? new IntersectionObserver(([e]) => vis = e.isIntersecting) : null; io && io.observe(el);

  onDispose(() => { run = false; cancelAnimationFrame(id); io && io.disconnect(); }); }

function mountSky(){

    if (light) { g.addColorStop(0, mix(t.accent, "#ffffff", .35)); g.addColorStop(.55, mix(t.accent, "#ffffff", .7)); g.addColorStop(1, t.bg); }
    else { g.addColorStop(0, mix(t.bg, t.accent, .1)); g.addColorStop(.45, mix(t.bg, t.accent, .22)); g.addColorStop(.72, mix(mix(t.bg, t.accent, .2).replace(/rgb\((.*)\)/, (_, v) => "#" + v.split(",").map(n => (+n).toString(16).padStart(2, "0")).join("")), t.accent2, .12)); g.addColorStop(1, t.bg); }

      const cg = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.r); cg.addColorStop(0, rgba(light ? "#ffffff" : tints[c.c], light ? .55 : .2)); cg.addColorStop(1, rgba(light ? "#ffffff" : tints[c.c], 0));

}

function mountRoles(){
  const roles = (S.profile.roles || []).filter(Boolean), el = $(".role .rt");

  const step = () => { if (!alive) return; const w = roles[i];
    if (!del) { ch++; el.textContent = w.slice(0, ch); if (ch >= w.length) { del = true; to = setTimeout(step, 1800); return; } }
    else { ch--; el.textContent = w.slice(0, ch); if (ch <= 0) { del = false; i = (i + 1) % roles.length; } }
    to = setTimeout(step, del ? 35 : 70); };

      else if (btn.dataset.act === "hide") b.hidden = !b.hidden;
      else if (btn.dataset.act === "dup") { const c = clone(b); c.id = uid(); S.blocks.splice(i + 1, 0, c); openCards.add(c.id); }
      else if (btn.dataset.act === "askdel") { $(`[data-del-zone="${i}"]`, body).innerHTML = `<span class="ed-confirm">Delete this block?<button class="ed-btn sm danger" data-act="del" data-i="${i}">Delete</button><button class="ed-btn sm" data-act="keep">Keep</button></span>`; wireEditor(body); return; }
      else if (btn.dataset.act === "keep") { drawEditor(); return; }
      else if (btn.dataset.act === "del") S.blocks.splice(i, 1);
      changed(); drawEditor();
      if (btn.dataset.act === "up" || btn.dataset.act === "down" || btn.dataset.act === "hide") setTimeout(() => { const el = $(`.blk[data-id="${b.id}"]`); el && el.scrollIntoView({behavior: reduced() ? "auto" : "smooth", block: "center"}); }, 200); });
    $$("[data-iact]", body).forEach(btn => btn.onclick = e => { e.stopPropagation(); const b = S.blocks[+btn.dataset.i], j = +btn.dataset.j, def = BLOCKS[b.type]; b.items = b.items || [];
      const a = btn.dataset.iact;
      if (a === "up") move(b.items, j, -1); else if (a === "down") move(b.items, j, 1);
      else if (a === "dup") b.items.splice(j + 1, 0, clone(b.items[j]));
      else if (a === "del") b.items.splice(j, 1);
      else if (a === "add") { b.items.push(clone(def.blank)); openCards.add(b.id + ":" + (b.items.length - 1)); }
      // item open-state keys shift with reorder: simplest is to close item cards of this block
      if (a !== "add") [...openCards].forEach(k => k.startsWith(b.id + ":") && openCards.delete(k));
      changed(); drawEditor(); });
    $$("[data-add]", body).forEach(btn => btn.onclick = () => { const type = btn.dataset.add, def = BLOCKS[type];
      const nb = {id: uid(), type, label: def.name.toLowerCase()};
      def.fields.forEach(([k, , t]) => { if (!(k in nb)) nb[k] = t === "range" ? 30 : t === "toggle" ? false : t === "select" ? "card" : t === "art" ? "" : ""; });
      if (type === "featured" || type === "art") Object.assign(nb, {c1: "#a9d8ff", c2: "#2a3f70"});
      if (type === "featured") Object.assign(nb, {kind: "new single", title: "Title", sub: S.profile.name});
      if (type === "countdown") Object.assign(nb, {title: "Next release", date: new Date(Date.now() + 14 * 864e5).toISOString().slice(0, 16)});
      if (type === "text") Object.assign(nb, {label: "", title: "Heading", body: "Say something here.", style: "card"});
      if (type === "studio") Object.assign(nb, {eyebrow: "now booking", title: "Work with me", blurb: "", cta: "Get in touch", ctaUrl: ""});
      if (type === "ticker") Object.assign(nb, {text: "new music out now, follow for more", speed: 30});
      if (def.items) nb.items = [clone(def.blank), clone(def.blank)];
      S.blocks.push(nb); openCards.add(nb.id); changed(); drawEditor();
      setTimeout(() => { $(".ed-body", ED).scrollTop = 0; const el = $(`.blk[data-id="${nb.id}"]`); el && el.scrollIntoView({behavior: "smooth", block: "center"}); const c = $(`[data-card="${nb.id}"]`, ED); c && c.scrollIntoView({block: "nearest"}); }, 250); });
  }
  if (tab === "profile") {
    $$("[data-bound]", body).forEach(box => bind(box, S.profile, re => re && drawEditor()));
    const ta = $("[data-roles]", body); ta && ta.addEventListener("input", () => { S.profile.roles = ta.value.split("\n").map(s => s.trim()).filter(Boolean); changed(); });
  }
  if (tab === "links") {
    $$("[data-soc]", body).forEach(box => bind(box, S.socials[+box.dataset.soc]));
    $$("[data-sact]", body).forEach(btn => btn.onclick = () => { const j = +btn.dataset.j, a = btn.dataset.sact;
      if (a === "up") move(S.socials, j, -1); else if (a === "down") move(S.socials, j, 1); else if (a === "del") S.socials.splice(j, 1); else S.socials.push({p: "web", url: ""});
      changed(); drawEditor(); });
  }
  if (tab === "style") {
    $$("[data-preset]", body).forEach(btn => btn.onclick = () => { const p = PRESETS[btn.dataset.preset]; Object.assign(S.theme, {preset: btn.dataset.preset, bg: p.bg, fg: p.fg, muted: p.muted, accent: p.accent, accent2: p.accent2}); changed(); drawEditor(); });
    $$("[data-bound]", body).forEach(box => bind(box, S.theme, (re, k) => { if (["bg","fg","accent","accent2","muted"].includes(k)) { S.theme.preset = "custom"; const c = $(`[data-k="${k}"]`, box); c && (c.nextElementSibling.textContent = c.value); $$("[data-preset]", body).forEach(b => b.setAttribute("aria-pressed", "false")); } }));
  }
  if (tab === "publish") wirePublishTab(body);
  if (tab === "motion") $$("[data-bound]", body).forEach(box => bind(box, S.motion, (re, k) => { if (k === "intro") replayIntro = true; }));
  $$("[data-draft]", body).forEach(b => b.onclick = () => { if (b.dataset.draft === "restore") { try { S = JSON.parse(draftPending); } catch (e) {} draftPending = false; changed(); } else { draftPending = false; lsSet(draftKey, null); } drawEditor(); });
}

const SKELETON_HEAD = (t, d, fav) => `<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>${esc(t)}</title>
<meta name="description" content="${esc(d)}">
<meta property="og:title" content="${esc(t)}">
<meta property="og:description" content="${esc(d)}">
<meta property="og:type" content="website">
<meta name="theme-color" content="${esc(S.theme.bg)}">
<link rel="icon" href="${fav}">`;
function favicon(){ const t = S.theme; const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="${t.bg}"/><circle cx="32" cy="32" r="20" fill="none" stroke="${t.accent}" stroke-width="5"/><circle cx="32" cy="32" r="5" fill="${t.accent2}"/></svg>`; return "data:image/svg+xml," + encodeURIComponent(svg); }
function buildDocument(){
  const p = S.profile, data = JSON.stringify(S).replace(/</g, "\\u003c");
  const desc = `${p.name}${(p.roles || []).length ? " · " + p.roles.join(", ") : ""}. Music, links and everything else in one place.`;
  return SKELETON_HEAD(p.name || "My page", desc, favicon())
    + `\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link id="sw-fonts" rel="stylesheet" href="${esc(fontsHref(S.theme))}">\n`
    + `<style id="sw-style">${$("#sw-style").textContent}</style>\n</head>\n<body>\n<script type="application/json" id="sw-data">${data}<\/script>\n<script id="sw-app">${$("#sw-app").textContent}<\/script>\n</body>\n</html>\n`;
}

async function publish(){
  const btn = $(".ed-publish", ED), g = ghGet();
  lsSet(draftKey, JSON.stringify(S));
  if (!g) { downloadPage(); toast("Downloaded index.html. Upload it to your host to update the live site."); return; }
  btn.disabled = true; status("Publishing to GitHub…");
  try {
    const cur = await gh(g, "GET");
    await gh(g, "PUT", {message: "Update page " + new Date().toISOString().slice(0, 16).replace("T", " "), content: b64(buildDocument()), branch: g.branch, ...(cur && cur.sha ? {sha: cur.sha} : {})});
    PUBLISHED_JSON = JSON.stringify(S); dirty = false; lsSet(draftKey, null);
    status("Published. Your live site updates in about a minute."); toast("Published. Your live site updates in about a minute.");
  } catch (e) { const m = ghError(e); status(m); toast(m); btn.disabled = false; }
}

function openEditor(){
  if (!ED) {
    ED = document.createElement("aside"); ED.className = "ed"; ED.setAttribute("aria-label", "Page editor");
    ED.innerHTML = `<div class="ed-head"><h2>Edit your page</h2><button class="pv" title="See the page exactly as visitors do">${ICO.eye}Preview</button><button class="x" aria-label="Close editor">${ICO.x}</button></div><div class="ed-tabs" role="tablist"></div><div class="ed-body"></div>
      <div class="ed-foot"><span class="ed-status"></span><span class="ed-discard-zone"><button class="ed-btn ed-discard">Discard</button></span><button class="ed-btn primary ed-publish">Publish</button></div>`;
    document.body.append(ED);
    $(".x", ED).onclick = closeEditor;
    $(".pv", ED).onclick = startPreview;
    $(".ed-publish", ED).onclick = publish;
    $(".ed-discard", ED).onclick = function discard(){ if (!dirty) return; const z = $(".ed-discard-zone", ED);
      z.innerHTML = `<span class="ed-confirm">Undo all?<button class="ed-btn sm danger" data-y>Yes</button><button class="ed-btn sm" data-n>No</button></span>`;
      $("[data-y]", z).onclick = () => { S = JSON.parse(PUBLISHED_JSON); lsSet(draftKey, null); changed(); z.innerHTML = '<button class="ed-btn ed-discard">Discard</button>'; $(".ed-discard", z).onclick = discard; drawEditor(); };
      $("[data-n]", z).onclick = () => { z.innerHTML = '<button class="ed-btn ed-discard">Discard</button>'; $(".ed-discard", z).onclick = discard; }; };
    addEventListener("keydown", e => { if (e.key === "Escape" && document.body.classList.contains("editing")) closeEditor(); });
  }
  document.body.classList.add("editing"); drawEditor(); setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 480);
}
function closeEditor(){ document.body.classList.remove("editing"); setTimeout(() => { const y = scrollY; render(); scrollTo(0, y); }, 480); }

function startPreview(){
  closeEditor(); document.body.classList.add("previewing"); scrollTo(0, 0);
  const chip = document.createElement("button"); chip.className = "pv-chip"; chip.textContent = "Exit preview";
  chip.onclick = () => { chip.remove(); document.body.classList.remove("previewing"); };
  document.body.append(chip); toast("This is what visitors see. Tap “Exit preview” in the corner to go back.");
}
function initOwner(){
  const ownerKey = "sw-owner";
  if (location.hash === "#edit") lsSet(ownerKey, "1");
  if (location.hash === "#visitor") lsSet(ownerKey, null);
  if (lsGet(ownerKey) !== "1") return;
  const fab = document.createElement("button"); fab.className = "ed-fab"; fab.innerHTML = `${I.pen}Edit page<span class="unsaved" hidden></span>`; fab.onclick = openEditor; document.body.append(fab);
  const draft = lsGet(draftKey);
  if (draft === PUBLISHED_JSON) lsSet(draftKey, null); else if (draft) $(".unsaved", fab).hidden = false;
  if (location.hash === "#edit") { history.replaceState(null, "", location.pathname + location.search); openEditor(); }
}
initOwner();
})();
</script>
